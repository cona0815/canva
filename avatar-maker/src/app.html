<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 紙娃娃角色產生器 v@@VERSION@@ @@DATE@@ · Cona 老師的資訊教室
     這個檔案是 tools/build.py 由 src/app.html 產生的，要改請改 src/app.html 再執行：python tools/build.py
     v0.5：改用 AI 畫的圖（Codex 生圖、tools/make_raster_pack.py 拆圖層），畫風只留老師選的三種：日式可愛、日式漫畫、韓系貼圖；
           canvas 疊圖，膚色、髮色、衣服、褲子、鞋子用程式換色；舊的 SVG 版保留在 紙娃娃角色產生器_v0.4_2026-11-15.html（原始檔 src/app_svg_v0.4.html）
     v0.4：手繪線條風　v0.3：全身／表情／動作／17 類（SVG）　v0.2：可切換畫風　v0.1：第 1 階段原型 -->
<title>紙娃娃角色產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{
  --bg:#f3f0fa; --paper:#ffffff; --ink:#2a2440; --muted:#6c6685; --line:#d9d3ea; --tile:#ffffff;
  --accent:#6b4fd8; --accent-soft:#e8e2fb; --sun:#ffc531; --warn:#e2553b; --chk1:#e6e1f3; --chk2:#ffffff;
  --f-d:"Huninn","Noto Sans TC",system-ui,sans-serif; --f-b:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17132a; --paper:#221c3a; --ink:#ece8fb; --muted:#a9a2c6; --line:#3a3260; --accent:#a58cff; --accent-soft:#30275a; --tile:#f4f1fb; --chk1:#2c2650; --chk2:#221c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17132a; --paper:#221c3a; --ink:#ece8fb; --muted:#a9a2c6; --line:#3a3260; --accent:#a58cff; --accent-soft:#30275a; --tile:#f4f1fb; --chk1:#2c2650; --chk2:#221c3a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px 12px 10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
h1{font-family:var(--f-d);font-weight:400;font-size:22px;margin:0;white-space:nowrap}
h1 small{font-family:var(--f-b);font-size:12px;color:var(--muted);margin-left:6px}
.sp{flex:1}
.lbl{font-weight:700;font-size:14px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:3px 14px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.help{color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;border:2px solid var(--accent-soft);border-radius:999px;padding:2px 12px;background:var(--paper)}
.main{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr) 250px;gap:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px}
.card h2{font-family:var(--f-d);font-weight:400;font-size:16px;margin:0 0 6px}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.stagecard{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px}
.stagebox{flex:1;min-height:0;display:grid;place-items:center}
#stage{display:block;border-radius:12px;border:2px solid var(--line)}
#stage.clear{background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/24px 24px}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wardrobe{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:5px}
.tab{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:2px 12px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.dim{opacity:.55}
.ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ohead h2{margin:0}
.ohead .cnt{color:var(--muted);font-size:13px}
.note{background:#fff6d6;color:#6b4e00;border-radius:10px;padding:3px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opts{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start;padding:2px}
.opt{position:relative;border:3px solid var(--line);background:var(--tile);border-radius:14px;padding:0;aspect-ratio:1;overflow:hidden}
.opt canvas{width:100%;height:100%;display:block}
.opt span{position:absolute;left:0;right:0;bottom:0;background:#ffffffd9;color:#2a2440;font-size:12px;font-weight:700;line-height:1.4;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt[aria-pressed="true"] span{background:var(--accent);color:#fff}
.opt:hover{border-color:var(--accent)}
.colors{display:grid;gap:4px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.crow .lab{font-weight:700;font-size:13px;min-width:3.2em}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw.orig{background:conic-gradient(#c9a27e 0 25%,#7aa0e0 0 50%,#c9a27e 0 75%,#7aa0e0 0)}
.bgs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.bgb{aspect-ratio:1;border-radius:10px;border:3px solid var(--line);padding:0;overflow:hidden}
.bgb canvas{width:100%;height:100%;display:block}
.bgb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.txt{padding:4px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.hint{color:var(--muted);font-size:12px;margin:5px 0 0;line-height:1.45}
.dl{display:grid;gap:6px}
.dl .btn{width:100%;padding:5px 12px}
.dl .btn.big{font-size:16px;padding:7px 12px}
#results{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#results figure{margin:0;display:grid;justify-items:center;font-size:11px;color:var(--muted)}
#results img{width:48px;height:48px;object-fit:contain;border-radius:8px;border:2px solid var(--line);background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font-family:var(--f-d);font-size:22px;z-index:20}
.foot{color:var(--muted);font-size:11px;text-align:center}
@media (max-width:980px),(max-height:540px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:minmax(0,1fr)}
  .stagebox{height:min(62vh,560px);flex:none}
  .opts{overflow:visible}
  .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
}
@media (max-height:760px) and (min-width:981px){.card{padding:8px}.col{gap:6px}.hint{margin-top:3px}.dl{gap:4px}.dl .btn.big{padding:5px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading">載入圖片中…</div>
<div class="app">
  <header>
    <h1>紙娃娃角色產生器<small>v@@VERSION@@</small></h1>
    <span class="lbl" id="sexLbl">角色</span>
    <span class="seg" role="group" aria-labelledby="sexLbl" id="sexSeg"><button type="button" data-sex="m">男生</button><button type="button" data-sex="f">女生</button><button type="button" data-sex="">全部</button></span>
    <span class="lbl" id="styleLbl">畫風</span>
    <span class="seg" role="group" aria-labelledby="styleLbl" id="styleSeg"></span>
    <span class="lbl" id="modeLbl">身體</span>
    <span class="seg" role="group" aria-labelledby="modeLbl"><button type="button" id="mHalf">半身</button><button type="button" id="mFull">全身</button></span>
    <span class="sp"></span>
    <a class="help" href="guide.html" target="_blank" rel="noopener">怎麼放進 Canva？</a>
  </header>
  <div class="main">
    <div class="col">
      <section class="card stagecard" aria-label="預覽">
        <div class="stagebox" id="stagebox"><canvas id="stage" class="clear" width="700" height="700"></canvas></div>
        <div class="tools">
          <button class="btn pri" type="button" id="bRandom">隨機搭配</button>
          <button class="btn" type="button" id="bTalk" aria-pressed="false">說話預覽</button>
          <button class="btn" type="button" id="bFlip" aria-pressed="false">翻轉</button>
          <button class="btn" type="button" id="bUndo">復原</button>
          <button class="btn" type="button" id="bReset">重設</button>
        </div>
      </section>
    </div>
    <div class="col">
      <section class="card wardrobe" aria-label="選擇部件">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="ohead"><h2 id="catTitle"></h2><span class="cnt" id="catCount"></span><span class="sp"></span><button class="btn" type="button" id="bCatRandom">這一類隨機</button></div>
        <div class="note" id="note" hidden></div>
        <div class="opts" id="opts"></div>
        <div class="colors" id="colors"></div>
      </section>
    </div>
    <div class="col side">
      <section class="card">
        <h2>背景</h2>
        <div class="bgs" id="bgs"></div>
        <label class="chk"><input type="checkbox" id="bgOut"> 下載時也要背景</label>
        <p class="hint">不勾＝透明背景（放進 Canva 最好用）。</p>
      </section>
      <section class="card">
        <h2>名字和角色代碼</h2>
        <div class="row"><label for="nameInput" class="lbl">名字</label><input class="txt" id="nameInput" maxlength="10" style="flex:1" autocomplete="off" placeholder="10 個字以內"></div>
        <div class="row" style="margin-top:6px"><button class="btn" type="button" id="bCopyCode">複製角色代碼</button></div>
        <div class="row" style="margin-top:6px">
          <input class="txt" id="codeInput" placeholder="貼上角色代碼" style="flex:1" autocomplete="off" aria-label="貼上角色代碼">
          <button class="btn" type="button" id="bLoadCode">還原</button>
        </div>
        <p class="hint">角色會自動存在這台電腦。換電腦或電腦被還原時，貼上代碼再按「還原」。</p>
      </section>
      <section class="card">
        <h2>下載，帶去 Canva</h2>
        <div class="dl">
          <button class="btn pri big" type="button" id="bPack">下載主播包（zip）</button>
          <div class="row"><button class="btn" type="button" id="bPng" style="flex:1;width:auto">只要 PNG</button><button class="btn" type="button" id="bGif" style="flex:1;width:auto">只要說話 GIF</button></div>
        </div>
        <p class="hint">主播包：閉嘴、張嘴、眨眼三張圖＋會說話的 GIF＋角色代碼。</p>
        <div id="results" aria-live="polite"></div>
      </section>
      <div class="foot">Cona 老師的資訊教室 · v@@VERSION@@ · @@DATE@@ · 圖：Codex 生成</div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const VERSION='@@VERSION@@', DATE='@@DATE@@';
const EMBED=/*@@EMBED@@*/null;   /* 離線版：{畫風:{pack, img:{名稱:dataURL}}} */
const $=id=>document.getElementById(id);
const CAT_ORDER=['face','hair','top','bottom','shoes','hat','glasses','hand','pet'];
const FULL_ONLY=['bottom','shoes','pet'];
const LAYERS=['base','bottom','shoes','top','face','hair','glasses','hat','hand','pet'];   /* 疊圖順序（底→頂） */
const SKIN=[null,'#ffe3cf','#f6c7a4','#e0a878','#b97a4f','#7d4b2e'];
const HAIRC=[null,'#2b2b33','#5a3a28','#b5651d','#e8b84a','#d9462f','#ff8fb3','#3f7fd9','#3faa6b','#8a5fd3','#c9ccd6'];
const CLOTH=[null,'#23407a','#1f7fbf','#4dc3c9','#2f9e5b','#ffc531','#f28c28','#e2553b','#ff8fb3','#8a5fd3','#8d6e63','#2b2b33'];
const PANTS=[null,'#3d5a8a','#2b2b33','#6c7383','#8d6e63','#c9a66b','#e2553b','#2f9e5b','#ff8fb3','#8a5fd3'];
const SHOE=[null,'#e2553b','#2b2b33','#8d6e63','#ffc531','#1f7fbf','#ff8fb3','#2f9e5b','#8a5fd3'];
const COLORS={face:[['skinC','膚色',SKIN]],hair:[['hairC','髮色',HAIRC]],top:[['topC','衣服',CLOTH]],bottom:[['pantsC','顏色',PANTS]],shoes:[['shoeC','顏色',SHOE]]};
const CKEYS=['skinC','hairC','topC','pantsC','shoeC'];
const BGS=[['none','透明'],['white','白色'],['pink','粉紅'],['yellow','鵝黃'],['mint','薄荷'],['blue','淺藍'],['purple','淡紫'],['sky','天空'],['news','新聞台'],['class','教室'],['stage','舞台'],['night','星空'],['stream','直播間']];
const SOLID={white:'#ffffff',pink:'#ffe0ea',yellow:'#fff3c4',mint:'#d8f5e6',blue:'#dcefff',purple:'#ece4ff'};
const KEY='dq-avatar-v5';
/* 男生／女生：照款式名稱分，沒列到的兩邊都有。選「全部」時所有款式都能用 */
const SEX_ONLY={
  f:['齊瀏海長直髮','雙馬尾','高馬尾','丸子頭','鮑伯頭','單邊辮子','超長直髮＋呆毛','雙丸子長辮','水手服','主播套裝','襯衫領結','百褶裙','舞台短裙','蝴蝶結','兔耳髮箍'],
  m:['清爽短髮','刺蝟頭','中分','主播西裝','西裝褲']};
const SEX_DEF={m:{hair:'清爽短髮',top:'主播西裝'},f:{hair:'齊瀏海長直髮',top:'水手服',bottom:'百褶裙'}};
const okSex=(o,sx)=>!sx||!(SEX_ONLY[sx==='m'?'f':'m'].includes(o.name));
const optsOf=(c,sx=state&&state.sex)=>PACK.cats[c].opts.filter(o=>okSex(o,sx));
function sexPatch(sx){   /* 換性別：身上不屬於這個性別的款式，換成這個性別的預設款（沒有就拿掉／換第一款） */
  const p={sex:sx};if(!sx)return p;
  CAT_ORDER.forEach(c=>{const C=PACK.cats[c];if(!C)return;const cur=C.opts.find(o=>o.id===state[c]);if(!cur||okSex(cur,sx))return;
    const d=C.opts.find(o=>o.name===(SEX_DEF[sx]||{})[c])||(C.none?null:optsOf(c,sx)[0]);p[c]=d?d.id:'';});
  const dh=PACK.cats.hair&&PACK.cats.hair.opts.find(o=>o.name===SEX_DEF[sx].hair);if(dh&&state.sex!==sx)p.hair=dh.id;
  return p;}
let STYLES=[],PACKS={},IMGS={},PACK,style,state,history=[],tab='face',talking=null,talkOpen=false,blinkNow=false;

/* ================= 載入 ================= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function loadPack(id){
  if(PACKS[id])return;
  let p,src;
  if(EMBED&&EMBED[id]){p=EMBED[id].pack;src=n=>EMBED[id].img[n];}
  else{p=await (await fetch(`packs/${id}/parts.json`,{cache:'no-cache'})).json();src=n=>`packs/${id}/${n}.webp`;}
  const names=['base'];
  Object.entries(p.cats).forEach(([c,C])=>C.opts.forEach(o=>{if(c==='face')['closed','open','blink'].forEach(s=>names.push(`face_${o.id}_${s}`));else{names.push(o.id);if(o.erase)names.push(o.id+'_erase');}}));
  const im={};await Promise.all(names.map(n=>loadImg(src(n)).then(i=>{im[n]=i;})));
  PACKS[id]=p;IMGS[id]=im;
}
function defaults(p){const d={};CAT_ORDER.forEach(c=>{const C=p.cats[c];d[c]=C?(C.none?'':C.opts[0].id):'';});
  return Object.assign({v:5,style:p.id,mode:'half',name:'小橋',flip:false,bg:'none',bgOut:false,sex:''},d,{skinC:null,hairC:null,topC:null,pantsC:null,shoeC:null});}
const isHex=v=>/^#[0-9a-f]{6}$/i.test(v||'');
function sanitize(s,p){
  const o=defaults(p);if(!s||typeof s!=='object')return o;
  CAT_ORDER.forEach(c=>{const C=p.cats[c];if(!C)return;const v=s[c];if(v===''&&C.none)o[c]='';else if(C.opts.some(x=>x.id===v))o[c]=v;});
  CKEYS.forEach(k=>{o[k]=isHex(s[k])?s[k].toLowerCase():null;});
  if(typeof s.name==='string')o.name=s.name.replace(/[\u0000-\u001f]/g,'').slice(0,10);
  o.flip=!!s.flip;o.bgOut=!!s.bgOut;if(BGS.some(b=>b[0]===s.bg))o.bg=s.bg;if(s.mode==='full'||s.mode==='half')o.mode=s.mode;if(s.sex==='m'||s.sex==='f')o.sex=s.sex;
  return o;
}

/* ================= 換色 =================
   all：整個部件換色相（頭髮）；main：只換部件主色（衣服、褲子、鞋子）；skin：人台的膚色 */
function rgb2hsv(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return [h,mx?d/mx:0,mx/255];}
function hsv2rgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255];}
const hdist=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d;};
const RC={};
function recolor(name,hex,mode){
  const img=IMGS[style][name];const key=style+name+hex+mode;if(RC[key])return RC[key];
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  const hs=[];let ss=0,vs=0,n=0;
  const want=mode==='skin'?(h,s,v)=>(h<45||h>340)&&s>.12&&s<.65&&v>.55:(h,s,v)=>v>.22&&s>.2;
  for(let i=0;i<p.length;i+=16){if(p[i+3]<200)continue;const [h,s,v]=rgb2hsv(p[i],p[i+1],p[i+2]);if(!want(h,s,v))continue;hs.push(h);ss+=s;vs+=v;n++;}
  if(!n){RC[key]=img;return img;}
  hs.sort((a,b)=>a-b);const refH=hs[hs.length>>1],refS=ss/n,refV=vs/n;
  const [tH,tS,tV]=rgb2hsv(...[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)));

function flash(m){toast.textContent=m;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),2000);}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
function commit(patch){history.push(JSON.stringify(state));if(history.length>40)history.shift();Object.assign(state,patch);save();renderAll();}

/* ================= 按鈕 ================= */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const NONE_P={hair:.03,hat:.55,glasses:.75,hand:.5,pet:.6};
function randomize(){const p={};CAT_ORDER.forEach(c=>{const C=PACK.cats[c];if(!C)return;p[c]=(C.none&&Math.random()<(NONE_P[c]||.3))?'':pick(optsOf(c)).id;});
  p.skinC=pick(SKIN);p.hairC=pick(HAIRC);p.topC=pick(CLOTH);p.pantsC=pick(PANTS);p.shoeC=pick(SHOE);commit(p);}
$('bRandom').onclick=()=>{randomize();flash('換一個新造型！');};
$('bCatRandom').onclick=()=>{const p={[tab]:pick(optsOf(tab)).id};(COLORS[tab]||[]).forEach(([k,,l])=>p[k]=pick(l));commit(p);};
function stopTalk(){if(talking){clearInterval(talking);talking=null;talkOpen=false;}$('bTalk').setAttribute('aria-pressed','false');$('bTalk').textContent='說話預覽';}
$('bTalk').onclick=()=>{if(talking){stopTalk();renderStage();return;}talking=setInterval(()=>{talkOpen=!talkOpen;renderStage();},200);$('bTalk').setAttribute('aria-pressed','true');$('bTalk').textContent='停止說話';};
setInterval(()=>{if(talking||document.hidden||!PACK)return;blinkNow=true;renderStage();setTimeout(()=>{blinkNow=false;renderStage();},150);},4200);
$('bFlip').onclick=()=>commit({flip:!state.flip});
document.querySelectorAll('#sexSeg button').forEach(b=>b.onclick=()=>{if((state.sex||'')!==b.dataset.sex){commit(sexPatch(b.dataset.sex));flash(b.dataset.sex?'只列出'+b.textContent+'的款式':'所有款式都列出來了');}});
$('mHalf').onclick=()=>commit({mode:'half'});$('mFull').onclick=()=>commit({mode:'full'});
$('bUndo').onclick=()=>{if(!history.length){flash('沒有可以復原的步驟');return;}state=sanitize(JSON.parse(history.pop()),PACK);save();renderAll();};
$('bReset').onclick=()=>{{const sx=state.sex,d=Object.assign(defaults(PACK),{name:state.name,mode:state.mode,sex:sx});CAT_ORDER.forEach(c=>{const C=PACK.cats[c],n=sx&&SEX_DEF[sx][c],o=C&&n&&C.opts.find(x=>x.name===n);if(o)d[c]=o.id;});commit(d);}flash('回到預設角色了，按「復原」可以救回來');};
$('nameInput').addEventListener('input',()=>{state.name=$('nameInput').value.slice(0,10);save();});
$('bgOut').addEventListener('change',()=>{state.bgOut=$('bgOut').checked;save();});
window.addEventListener('resize',fitStage);

/* ================= 角色代碼 DQ5 ================= */
const CODE_KEYS=['style','mode','name','flip','bg','bgOut',...CAT_ORDER,...CKEYS,'sex'];   /* sex 放最後，舊代碼少這格也能讀 */
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))));
const enc=s=>'DQ5-'+b64e(JSON.stringify(CODE_KEYS.map(k=>typeof s[k]==='boolean'?(s[k]?1:0):(CKEYS.includes(k)?(s[k]?s[k].slice(1):0):s[k]))));
function decRaw(t){t=String(t).replace(/\s+/g,'');if(!t.startsWith('DQ5-'))throw 0;const a=JSON.parse(b64d(t.slice(4)));if(!Array.isArray(a))throw 0;const o={};
  CODE_KEYS.forEach((k,i)=>{let v=a[i];if(k==='flip'||k==='bgOut')v=!!v;else if(CKEYS.includes(k))v=v?'#'+v:null;o[k]=v;});return o;}
$('bCopyCode').onclick=()=>{const code=enc(state),inp=$('codeInput');const fb=()=>{inp.value=code;inp.select();flash('代碼在下面的框裡，按 Ctrl+C 複製');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(()=>{inp.value=code;flash('角色代碼複製好了！');},fb);else fb();};
$('bLoadCode').onclick=()=>{let raw;try{raw=decRaw($('codeInput').value);}catch(e){flash('這不是正確的角色代碼（舊版的代碼不能用在新畫風）');return;}
  history=[];const id=STYLES.some(x=>x.id===raw.style)?raw.style:STYLES[0].id;setStyle(id,raw).then(()=>{$('codeInput').value='';flash('角色還原成功！');});};

/* ================= 匯出 ================= */
function renderTo(pose,w){const [W,H]=stageSize();const c=document.createElement('canvas');c.width=w;c.height=Math.round(w*H/W);draw(c.getContext('2d'),state,pose,effMode(),state.bgOut&&state.bg!=='none');return c;}
const canvasBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
const fname=()=>(state.name.trim()||'我的角色').replace(/[\\/:*?"<>|.\u0000-\u001f]/g,'')||'我的角色';
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function showResults(items){const box=$('results');box.innerHTML='';items.forEach(([blob,label])=>{const f=document.createElement('figure');const i=document.createElement('img');i.src=URL.createObjectURL(blob);i.alt=label;const c=document.createElement('figcaption');c.textContent=label;f.append(i,c);box.append(f);});}
const POSES=[['閉嘴',{mouth:'closed'}],['張嘴',{mouth:'open'}],['眨眼',{mouth:'closed',eyes:'blink'}]];
function lzw(idx){const out=[];let cur=0,bits=0,size=9,next=258,table=new Map();
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8;}};
  emit(256);let p=idx[0];
  for(let i=1;i<idx.length;i++){const k=idx[i],key=p<<8|k,f=table.get(key);if(f!==undefined){p=f;continue;}emit(p);
    if(next===4096){emit(256);next=258;size=9;table=new Map();}else{if(next>=(1<<size))size++;table.set(key,next++);}p=k;}
  emit(p);emit(257);if(bits>0)out.push(cur&255);return out;}
function makeGif(frames,w,h,delayCs){
  const count=new Map();
  frames.forEach(d=>{for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const k=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3);count.set(k,(count.get(k)||0)+1);}});
  const top=[...count.entries()].sort((a,b)=>b[1]-a[1]).slice(0,255).map(e=>e[0]);
  const pal=top.map(k=>[(k>>10&31)<<3|4,(k>>5&31)<<3|4,(k&31)<<3|4]);const cache=new Map(top.map((k,i)=>[k,i+1]));
  const nearest=k=>{let v=cache.get(k);if(v)return v;const r=(k>>10&31)<<3,g=(k>>5&31)<<3,b=(k&31)<<3;let best=1,bd=1e9;
    for(let i=0;i<pal.length;i++){const p=pal[i],d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(d<bd){bd=d;best=i+1;}}cache.set(k,best);return best;};
  const bytes=[];const push=(...a)=>a.forEach(v=>bytes.push(v&255));const w16=v=>push(v,v>>8);
  'GIF89a'.split('').forEach(c=>push(c.charCodeAt(0)));w16(w);w16(h);push(0xF7,0,0);
  push(0,0,0);for(let i=0;i<255;i++){const p=pal[i]||[0,0,0];push(p[0],p[1],p[2]);}
  push(0x21,0xFF,0x0B);'NETSCAPE2.0'.split('').forEach(c=>push(c.charCodeAt(0)));push(3,1,0,0,0);
  frames.forEach(d=>{const idx=new Uint8Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)idx[j]=d[i+3]<128?0:nearest((d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3));
    push(0x21,0xF9,4,0x09);w16(delayCs);push(0,0);push(0x2C);w16(0);w16(0);w16(w);w16(h);push(0);push(8);
    const data=lzw(idx);for(let i=0;i<data.length;i+=255){const n=Math.min(255,data.length-i);push(n);for(let j=0;j<n;j++)bytes.push(data[i+j]);}push(0);});
  push(0x3B);return new Blob([new Uint8Array(bytes)],{type:'image/gif'});}
async function buildGif(){const get=pose=>{const c=renderTo(pose,500);return [c.getContext('2d').getImageData(0,0,c.width,c.height).data,c.width,c.height];};
  const [c,w,h]=get({mouth:'closed'}),[o]=get({mouth:'open'}),[b]=get({mouth:'closed',eyes:'blink'});return makeGif([c,o,c,o,c,o,b,o,c,o],w,h,20);}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function makeZip(files){const te=new TextEncoder(),chunks=[],central=[];let off=0;const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  files.forEach(f=>{const n=te.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const head=[0x50,0x4B,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(n.length),...u16(0)];
    chunks.push(new Uint8Array(head),n,f.data);
    central.push(new Uint8Array([0x50,0x4B,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
    off+=head.length+n.length+sz;});
  const cs=central.reduce((a,c)=>a+c.length,0);const end=new Uint8Array([0x50,0x4B,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...chunks,...central,end],{type:'application/zip'});}
const bytesOf=async b=>new Uint8Array(await b.arrayBuffer());
const README=n=>`${n} 的主播包（紙娃娃角色產生器 v${VERSION}）

1. 把這些檔案全部上傳到 Canva（左邊「上傳」）。
2. 「${n}_閉嘴.png」放最底層，時間拉滿整段影片。
3. 「${n}_說話.gif」疊在上面、位置對齊，只放在有聲音的地方；停頓時拿掉，主播就會閉嘴。
4. 聲音用 Canva 的「文字轉語音」，或自己錄。
5. 「${n}_角色代碼.txt」留著，下次貼回紙娃娃網站按「還原」，就能繼續改。
`;
async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='製作中…';stopTalk();try{await fn();}catch(e){console.error(e);flash('製作失敗，請再試一次');}btn.disabled=false;btn.textContent=t;}
const OUT_W=1024;
$('bPng').onclick=()=>busy($('bPng'),async()=>{const b=await canvasBlob(renderTo({mouth:'closed'},OUT_W));download(b,fname()+'.png');showResults([[b,'PNG']]);flash('PNG 下載好了');});
$('bGif').onclick=()=>busy($('bGif'),async()=>{const g=await buildGif();download(g,fname()+'_說話.gif');showResults([[g,'說話 GIF']]);flash('GIF 下載好了');});
$('bPack').onclick=()=>busy($('bPack'),async()=>{const n=fname(),files=[],shown=[];
  for(const [label,pose] of POSES){const b=await canvasBlob(renderTo(pose,OUT_W));files.push({name:`${n}_${label}.png`,data:await bytesOf(b)});shown.push([b,label]);}
  const g=await buildGif();files.push({name:`${n}_說話.gif`,data:await bytesOf(g)});shown.push([g,'說話 GIF']);
  const te=new TextEncoder();files.push({name:`${n}_角色代碼.txt`,data:te.encode(enc(state))});files.push({name:'使用說明.txt',data:te.encode(README(n))});
  download(makeZip(files),n+'_主播包.zip');showResults(shown);flash('主播包下載好了，解壓縮後上傳到 Canva');});

/* ================= 畫風 ================= */
async function setStyle(id,parts){
  stopTalk();$('loading').hidden=false;
  try{await loadPack(id);}catch(e){console.error(e);$('loading').hidden=true;flash('這個畫風載入失敗');return;}
  style=id;PACK=PACKS[id];
  state=sanitize(Object.assign({},parts||state||{},{style:id}),PACK);save();$('loading').hidden=true;renderAll();
}
window.__avatar={get state(){return state;},get PACK(){return PACK;},draw,enc,dec:t=>sanitize(decRaw(t),PACK),setStyle,randomize,commit,buildGif,makeZip,renderTo,
  get tab(){return tab;},set tab(v){tab=v;renderTabs();renderOpts();},get STYLES(){return STYLES;}};
(async()=>{
  try{STYLES=EMBED?Object.keys(EMBED).map(k=>({id:k,name:EMBED[k].pack.name})):await (await fetch('packs/index.json',{cache:'no-cache'})).json();}catch(e){STYLES=[];}
  STYLES=STYLES.filter(x=>x&&x.id);
  if(!STYLES.length){$('loading').textContent='找不到畫風，請重新整理';return;}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  const id=saved&&STYLES.some(x=>x.id===saved.style)?saved.style:STYLES[0].id;
  await setStyle(id,saved);
  requestAnimationFrame(fitStage);
})();
})();
