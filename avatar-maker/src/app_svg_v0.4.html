<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 紙娃娃角色產生器 v@@VERSION@@ @@DATE@@ · Cona 老師的資訊教室
     這個檔案是 tools/build.py 由 src/app.html 產生的，要改請改 src/app.html 再執行：python tools/build.py
     v0.4：新增畫風「手繪線條風」（Codex 製作，94 個部件），離線版三種畫風都包進去
     v0.3：全身／半身、表情 9 種、動作 4 種、17 類部件（扁平圓潤風、Q 版描邊風各 164 個）、背景 11 種、可選透明匯出、1366×768 一頁放得下
     v0.2：可切換畫風，從 packs/<id>/pack.json 載入風格包（格式見 packs/README.md）
     v0.1：扁平圓潤風、半身；換色、隨機、復原、說話預覽、PNG／主播包（zip：閉嘴＋張嘴＋眨眼＋說話 GIF）、角色代碼 -->
<title>紙娃娃角色產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：左＝試衣間（預覽＋動作列），中＝衣櫃（分類＋選項＋色票），右＝背景、名字代碼、下載 */
:root{
  --bg:#f3f0fa; --paper:#ffffff; --ink:#2a2440; --muted:#6c6685; --line:#d9d3ea; --tile:#ffffff;
  --accent:#6b4fd8; --accent-soft:#e8e2fb; --sun:#ffc531; --ok:#2f9e5b; --warn:#e2553b;
  --chk1:#e6e1f3; --chk2:#ffffff;
  --f-d:"Huninn","Noto Sans TC",system-ui,sans-serif; --f-b:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17132a; --paper:#221c3a; --ink:#ece8fb; --muted:#a9a2c6; --line:#3a3260; --accent:#a58cff; --accent-soft:#30275a; --tile:#f4f1fb;
  --chk1:#2c2650; --chk2:#221c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17132a; --paper:#221c3a; --ink:#ece8fb; --muted:#a9a2c6; --line:#3a3260; --accent:#a58cff; --accent-soft:#30275a; --tile:#f4f1fb;
  --chk1:#2c2650; --chk2:#221c3a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px 12px 10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
h1{font-family:var(--f-d);font-weight:400;font-size:22px;margin:0;white-space:nowrap}
h1 small{font-family:var(--f-b);font-size:12px;color:var(--muted);margin-left:6px}
.hd-sp{flex:1}
.lbl{font-weight:700;font-size:14px}
.sel{border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:3px 8px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:3px 14px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.help{color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;border:2px solid var(--accent-soft);border-radius:999px;padding:2px 12px;background:var(--paper)}
.help:hover{border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr) 250px;gap:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px}
.card h2{font-family:var(--f-d);font-weight:400;font-size:16px;margin:0 0 6px}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
/* 試衣間 */
.stagecard{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px}
.stagebox{flex:1;min-height:0;display:grid;place-items:center}
.stage{border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--paper)}
.stage[data-bg="none"]{background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/24px 24px}
.stage svg{width:100%;height:100%;display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.outfit{position:relative}
.outfit summary{list-style:none}
.outfit summary::-webkit-details-marker{display:none}
.outfit .pop{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:min(340px,86vw);background:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:8px;z-index:5;box-shadow:0 8px 24px #0003}
.outfit .pop p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:0 9px;font-size:13px}
.tag:hover{border-color:var(--warn)}
/* 衣櫃 */
.wardrobe{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.groups{display:flex;flex-wrap:wrap;gap:6px 14px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.grp>b{font-size:12px;color:var(--muted);padding:0 2px}
.tab{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:1px 10px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.dim{opacity:.55}
.ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ohead h2{margin:0}
.ohead .cnt{color:var(--muted);font-size:13px}
[hidden]{display:none!important}
.note{background:#fff6d6;color:#6b4e00;border-radius:10px;padding:3px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opts{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;align-content:start;padding:2px}
.opt{position:relative;border:3px solid var(--line);background:var(--tile);border-radius:12px;padding:0;aspect-ratio:1;overflow:hidden}
.opt svg{width:100%;height:100%;display:block}
.opt span{position:absolute;left:0;right:0;bottom:0;background:#ffffffd9;color:#2a2440;font-size:12px;font-weight:700;line-height:1.35;padding:1px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt[aria-pressed="true"] span{background:var(--accent);color:#fff}
.opt:hover{border-color:var(--accent)}
.colors{display:grid;gap:4px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.crow .lab{font-weight:700;font-size:13px;min-width:3.2em}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 右欄 */
.bgs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.bgb{aspect-ratio:1;border-radius:10px;border:3px solid var(--line);padding:0;overflow:hidden}
.bgb svg{width:100%;height:100%;display:block}
.bgb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.txt{padding:4px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.hint{color:var(--muted);font-size:12px;margin:5px 0 0;line-height:1.45}
.dl{display:grid;gap:6px}
.dl .btn{width:100%;padding:5px 12px}
.dl .btn.big{font-size:16px;padding:7px 12px}
#results{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#results figure{margin:0;display:grid;justify-items:center;font-size:11px;color:var(--muted)}
#results img{width:48px;height:48px;object-fit:contain;border-radius:8px;border:2px solid var(--line);background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:11px;text-align:center}
/* 小螢幕：改成上下排，可以捲動 */
@media (max-width:980px),(max-height:540px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:minmax(0,1fr)}
  .stagebox{height:min(62vh,520px);flex:none}
  .opts{max-height:none;overflow:visible}
  .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>紙娃娃角色產生器<small>v@@VERSION@@</small></h1>
    <label class="lbl" for="styleSel">畫風 <select id="styleSel" class="sel"></select></label>
    <span class="lbl" id="modeLbl">身體</span>
    <span class="seg" role="group" aria-labelledby="modeLbl"><button type="button" id="mHalf">半身</button><button type="button" id="mFull">全身</button></span>
    <span class="hd-sp"></span>
    <a class="help" href="guide.html" target="_blank" rel="noopener">怎麼放進 Canva？</a>
  </header>

  <div class="main">
    <div class="col">
      <section class="card stagecard" aria-label="預覽">
        <div class="stagebox" id="stagebox"><div class="stage" id="stage" data-bg="none"></div></div>
        <div class="tools">
          <button class="btn pri" type="button" id="bRandom">隨機搭配</button>
          <button class="btn" type="button" id="bTalk" aria-pressed="false">說話預覽</button>
          <button class="btn" type="button" id="bFlip" aria-pressed="false">翻轉</button>
          <button class="btn" type="button" id="bUndo">復原</button>
          <button class="btn" type="button" id="bReset">重設</button>
          <details class="outfit" id="outfitBox"><summary class="btn">目前搭配 <b id="outfitN">0</b> 件</summary>
            <div class="pop"><p>點一下可以脫掉（灰色的不能脫，點了會跳到那一類）</p><div class="tags" id="outfit"></div></div></details>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="card wardrobe" aria-label="選擇部件">
        <div class="groups" id="tabs" role="tablist"></div>
        <div class="ohead"><h2 id="catTitle">髮型</h2><span class="cnt" id="catCount"></span><span class="hd-sp"></span><button class="btn" type="button" id="bCatRandom">這一類隨機</button></div>
        <div class="note" id="note" hidden></div>
        <div class="opts" id="opts"></div>
        <div class="colors" id="colors"></div>
      </section>
    </div>

    <div class="col side">
      <section class="card">
        <h2>背景</h2>
        <div class="bgs" id="bgs"></div>
        <label class="chk"><input type="checkbox" id="bgOut"> 下載時也要背景</label>
        <p class="hint">不勾＝透明背景（放進 Canva 最好用）。</p>
      </section>
      <section class="card">
        <h2>名字和角色代碼</h2>
        <div class="row"><label for="nameInput" class="lbl">名字</label><input class="txt" id="nameInput" maxlength="10" style="flex:1" autocomplete="off" placeholder="10 個字以內"></div>
        <div class="row" style="margin-top:6px">
          <button class="btn" type="button" id="bCopyCode">複製角色代碼</button>
        </div>
        <div class="row" style="margin-top:6px">
          <input class="txt" id="codeInput" placeholder="貼上角色代碼" style="flex:1" autocomplete="off" aria-label="貼上角色代碼">
          <button class="btn" type="button" id="bLoadCode">還原</button>
        </div>
        <p class="hint">角色會自動存在這台電腦。換電腦或電腦被還原時，貼上代碼再按「還原」。</p>
      </section>
      <section class="card">
        <h2>下載，帶去 Canva</h2>
        <div class="dl">
          <button class="btn pri big" type="button" id="bPack">下載主播包（zip）</button>
          <div class="row"><button class="btn" type="button" id="bPng" style="flex:1;width:auto">只要 PNG</button><button class="btn" type="button" id="bGif" style="flex:1;width:auto">只要說話 GIF</button></div>
        </div>
        <p class="hint">主播包：閉嘴、張嘴、眨眼三張圖＋會說話的 GIF＋角色代碼。</p>
        <div id="results" aria-live="polite"></div>
      </section>
      <div class="foot">Cona 老師的資訊教室 · v@@VERSION@@ · @@DATE@@</div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const VERSION='@@VERSION@@', DATE='@@DATE@@';
/* 內建的扁平圓潤風（packs/flat/pack.json，也是載入失敗時的備援）；離線版會把其他畫風也放進 EMBED */
const FLAT=/*@@FLAT@@*/null;
const EMBED=/*@@EMBED@@*/{};
const EMBED_LIST=/*@@EMBED_LIST@@*/[];

const ORDER1=['face','hair','brow','eyes','mouth','nose','deco','glasses','hat','top','hand'];
const ORDER2=['face','hair','brow','eyes','mouth','nose','deco','glasses','hat','headset','top','coat','bottom','shoes','hand','back','pet'];
const GROUPS=[['臉',['face','eyes','brow','mouth','nose','deco','expr']],['頭',['hair','hat','headset','glasses']],['身體',['top','coat','bottom','shoes','back']],['小物',['hand','pet','pose']]];
const SHORT={deco:'裝飾',hat:'帽子',headset:'耳機',expr:'表情',pose:'動作',hand:'手持物',back:'背後',pet:'夥伴'};
const FULL_ONLY=['bottom','shoes'];
/* 縮圖時先拿掉會擋住的東西 */
const THUMB_HIDE={eyes:{expr:'normal',glasses:''},mouth:{expr:'normal',hand:''},brow:{expr:'normal'},top:{coat:'',hand:'',back:''},coat:{hand:''},
  bottom:{hand:'',pet:'',back:'',coat:''},shoes:{pet:'',back:''},hand:{pose:'stand'},face:{hand:''},deco:{expr:'normal'},expr:{hand:''},back:{pet:''},hair:{hat:'',headset:''}};
const SKIN=['#ffe8d6','#ffdcbf','#f6c7a4','#eab38a','#d39a6a','#b97a4f','#8d5a3a','#6b4129'];
const HAIRC=['#2b2b33','#3b2a24','#6b4226','#b5651d','#e8b84a','#d9462f','#ff8fb3','#3f7fd9','#3faa6b','#8a5fd3','#c9ccd6','#f4f4f4'];
const EYEC=['#2b2b33','#5a3a22','#2f6fb5','#2f9e5b','#7a4fd0','#d9822b','#c4375a','#4aa3a3'];
const CLOTH=['#23407a','#1f7fbf','#4dc3c9','#2f9e5b','#7bd389','#ffc531','#f28c28','#e2553b','#c4375a','#ff8fb3','#8a5fd3','#8d6e63','#2b2b33','#6c7383','#c9ccd6','#ffffff'];
const PANTS=['#3d5a8a','#24324d','#2b2b33','#6c7383','#8d6e63','#c9a66b','#e2553b','#2f9e5b','#1f7fbf','#ff8fb3','#8a5fd3','#ffffff'];
const SHOE=['#e2553b','#2b2b33','#ffffff','#8d6e63','#ffc531','#1f7fbf','#ff8fb3','#2f9e5b','#8a5fd3','#c9ccd6'];
const PETC=['#f28c28','#8b8f9c','#f4f1ea','#8d6e63','#3b3b44','#ffb3c7','#7cc4ff','#7bd389','#ffd84d','#b48cff'];
const COLORS={face:[['skin','膚色',SKIN]],hair:[['hairC','髮色',HAIRC]],brow:[['hairC','髮色',HAIRC]],eyes:[['eyeC','眼睛',EYEC]],
  glasses:[['c2','鏡框',CLOTH]],hat:[['hatC','顏色',CLOTH]],headset:[['accC','顏色',CLOTH]],top:[['c1','主色',CLOTH],['c2','副色',CLOTH]],
  coat:[['coatC','顏色',CLOTH]],bottom:[['pantsC','顏色',PANTS]],shoes:[['shoeC','顏色',SHOE]],hand:[['c2','顏色',CLOTH]],back:[['backC','顏色',CLOTH]],pet:[['petC','顏色',PETC]]};
const CKEYS=['skin','hairC','eyeC','c1','c2','hatC','accC','coatC','pantsC','shoeC','backC','petC'];
const BGS=[['none','透明'],['white','白色'],['pink','粉紅'],['yellow','鵝黃'],['mint','薄荷'],['blue','淺藍'],['purple','淡紫'],['sky','天空'],['news','新聞台'],['class','教室'],['stage','舞台'],['night','星空']];
const SOLID={white:'#ffffff',pink:'#ffe0ea',yellow:'#fff3c4',mint:'#d8f5e6',blue:'#dcefff',purple:'#ece4ff'};
const COMMON={v:3,style:'flat',mode:'half',name:'小橋',skin:SKIN[1],hairC:HAIRC[1],eyeC:EYEC[0],c1:CLOTH[0],c2:CLOTH[7],hatC:CLOTH[7],accC:CLOTH[12],
  coatC:CLOTH[3],pantsC:PANTS[0],shoeC:SHOE[0],backC:CLOTH[5],petC:PETC[0],flip:false,bg:'none',bgOut:false,expr:'normal',pose:'stand'};
const KEY='dq-avatar-v1';
const $=id=>document.getElementById(id);

/* ================= 風格包 ================= */
let PACK,FMT,ORDER,BASE,VIEW,DEFAULT;
const STYLES=[{id:'flat',name:'扁平圓潤風'}];
EMBED_LIST.forEach(x=>{if(!STYLES.some(y=>y.id===x.id))STYLES.push(x);});
function validPack(p){
  if(!p||typeof p!=='object'||!p.cats||!p.base||!p.defaults)return false;
  const f=p.format===2?2:1, ord=f===2?ORDER2:ORDER1;
  if(!ord.every(c=>p.cats[c]&&Array.isArray(p.cats[c].opts)&&p.cats[c].opts.length))return false;
  if(f===2&&!(p.base.arms&&p.poses&&p.poses.stand&&p.expr&&p.expr.normal))return false;
  return true;
}
function usePack(p){PACK=p;FMT=p.format===2?2:1;ORDER=FMT===2?ORDER2:ORDER1;BASE=p.base;VIEW=p.view||{};
  const d={};ORDER2.forEach(c=>d[c]=(p.defaults[c]!==undefined?p.defaults[c]:''));DEFAULT=Object.assign({},COMMON,d);}
usePack(FLAT);
const cache={flat:FLAT};
async function loadStyle(id){
  if(cache[id]){usePack(cache[id]);return true;}
  try{let p=EMBED[id];
    if(!p){const r=await fetch('packs/'+encodeURIComponent(id)+'/pack.json',{cache:'no-cache'});if(!r.ok)throw 0;p=await r.json();}
    if(!validPack(p))throw 0;cache[id]=p;usePack(p);return true;}
  catch(e){usePack(FLAT);return false;}
}

/* ================= 狀態 ================= */
let state, history=[], tab='hair';
const isHex=v=>/^#[0-9a-f]{6}$/i.test(v||'');
function sanitize(s){
  const o=Object.assign({},DEFAULT);
  if(!s||typeof s!=='object')return o;
  ORDER2.forEach(c=>{const v=s[c];
    if(!PACK.cats[c]){if(typeof v==='string'&&/^[a-z0-9_-]{0,12}$/i.test(v))o[c]=v;return;}
    if(v===''&&PACK.cats[c].none)o[c]='';else if(PACK.cats[c].opts.some(x=>x.id===v))o[c]=v;});
  CKEYS.forEach(k=>{if(isHex(s[k]))o[k]=s[k].toLowerCase();});
  if(typeof s.name==='string')o.name=s.name.replace(/[\u0000-\u001f]/g,'').slice(0,10);
  o.flip=!!s.flip;o.bgOut=!!s.bgOut;
  let bg=s.bg;if(!(s.v>=3)){if(bg==='none')bg='white';else if(bg==='grid')bg='none';}  /* v0.2 的「白色」叫 none、「格線」叫 grid */
  if(BGS.some(b=>b[0]===bg))o.bg=bg;
  if(s.mode==='full'||s.mode==='half')o.mode=s.mode;
  if(FMT===2&&typeof s.expr==='string'&&PACK.expr[s.expr])o.expr=s.expr;
  if(FMT===2&&typeof s.pose==='string'&&PACK.poses[s.pose])o.pose=s.pose;
  if(typeof s.style==='string'&&STYLES.some(x=>x.id===s.style))o.style=s.style;
  return o;
}

/* ================= 角色代碼 =================

const CODE_KEYS=['style','mode','name','flip','bg','bgOut','expr','pose',...ORDER2,...CKEYS];

const enc=s=>'DQ2-'+b64e(JSON.stringify(CODE_KEYS.map(k=>typeof s[k]==='boolean'?(s[k]?1:0):(CKEYS.includes(k)?String(s[k]).slice(1):s[k]))));
function decRaw(t){
  t=String(t).replace(/\s+/g,'');
  if(t.startsWith('DQ1-'))return JSON.parse(b64d(t.slice(4)));
  if(t.startsWith('DQ2-')){const a=JSON.parse(b64d(t.slice(4)));if(!Array.isArray(a))throw 0;const o={v:3};
    CODE_KEYS.forEach((k,i)=>{let v=a[i];if(['flip','bgOut'].includes(k))v=!!v;else if(CKEYS.includes(k))v='#'+v;o[k]=v;});return o;}
  throw 0;
}

/* GIF：全域色盤＋透明色，LZW 壓縮 */
function lzw(idx){const out=[];let cur=0,bits=0,size=9,next=258,table=new Map();
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8;}};
  emit(256);let p=idx[0];
  for(let i=1;i<idx.length;i++){const k=idx[i],key=p<<8|k,f=table.get(key);
    if(f!==undefined){p=f;continue;}
    emit(p);
    if(next===4096){emit(256);next=258;size=9;table=new Map();}
    else{if(next>=(1<<size))size++;table.set(key,next++);}
    p=k;}
  emit(p);emit(257);if(bits>0)out.push(cur&255);return out;}
function makeGif(frames,w,h,delayCs){
  const count=new Map();
  frames.forEach(d=>{for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const k=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3);count.set(k,(count.get(k)||0)+1);}});
  const top=[...count.entries()].sort((a,b)=>b[1]-a[1]).slice(0,255).map(e=>e[0]);
  const pal=top.map(k=>[(k>>10&31)<<3|4,(k>>5&31)<<3|4,(k&31)<<3|4]);
  const cache=new Map(top.map((k,i)=>[k,i+1]));
  const nearest=k=>{let v=cache.get(k);if(v)return v;const r=(k>>10&31)<<3,g=(k>>5&31)<<3,b=(k&31)<<3;let best=1,bd=1e9;
    for(let i=0;i<pal.length;i++){const p=pal[i],d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(d<bd){bd=d;best=i+1;}}cache.set(k,best);return best;};
  const bytes=[];const push=(...a)=>a.forEach(v=>bytes.push(v&255));const w16=v=>push(v,v>>8);
  'GIF89a'.split('').forEach(c=>push(c.charCodeAt(0)));w16(w);w16(h);push(0xF7,0,0);
  push(0,0,0);for(let i=0;i<255;i++){const p=pal[i]||[0,0,0];push(p[0],p[1],p[2]);}
  push(0x21,0xFF,0x0B);'NETSCAPE2.0'.split('').forEach(c=>push(c.charCodeAt(0)));push(3,1,0,0,0);
  frames.forEach(d=>{
    const idx=new Uint8Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)idx[j]=d[i+3]<128?0:nearest((d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3));
    push(0x21,0xF9,4,0x09);w16(delayCs);push(0,0);
    push(0x2C);w16(0);w16(0);w16(w);w16(h);push(0);push(8);
    const data=lzw(idx);for(let i=0;i<data.length;i+=255){const n=Math.min(255,data.length-i);push(n);for(let j=0;j<n;j++)bytes.push(data[i+j]);}
    push(0);});
  push(0x3B);return new Blob([new Uint8Array(bytes)],{type:'image/gif'});}
async function buildGif(){
  const m=effMode(state),W=500,H=H_OF(m)/2;
  const get=async pose=>(await toCanvas(svgDoc(state,pose,m,null,outBg(),W,H),W,H)).getContext('2d').getImageData(0,0,W,H).data;
  const c=await get({mouth:'closed'}),o=await get({mouth:'open'}),b=await get({mouth:'closed',eyes:'blink'});
  return makeGif([c,o,c,o,c,o,b,o,c,o],W,H,20);}

/* ZIP（不壓縮，檔名用 UTF-8） */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function makeZip(files){
  const te=new TextEncoder(),chunks=[],central=[];let off=0;
  const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  files.forEach(f=>{const n=te.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const head=[0x50,0x4B,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(n.length),...u16(0)];
    chunks.push(new Uint8Array(head),n,f.data);
    central.push(new Uint8Array([0x50,0x4B,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
    off+=head.length+n.length+sz;});
  const cs=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([0x50,0x4B,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...chunks,...central,end],{type:'application/zip'});}
const bytesOf=async b=>new Uint8Array(await b.arrayBuffer());
const README=n=>`${n} 的主播包（紙娃娃角色產生器 v${VERSION}）

1. 把這些檔案全部上傳到 Canva（左邊「上傳」）。
2. 「${n}_閉嘴.png」放最底層，時間拉滿整段影片。
3. 「${n}_說話.gif」疊在上面、位置對齊，只放在有聲音的地方；停頓時拿掉，主播就會閉嘴。
4. 聲音用 Canva 的「文字轉語音」，或自己錄。
5. 「${n}_角色代碼.txt」留著，下次貼回紙娃娃網站按「還原」，就能繼續改。
`;

async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='製作中…';stopTalk();try{await fn();}catch(e){console.error(e);flash('製作失敗，請再試一次');}btn.disabled=false;btn.textContent=t;}
$('bPng').addEventListener('click',()=>busy($('bPng'),async()=>{
  const b=await pngOf({mouth:'closed'});download(b,fname()+'.png');showResults([[b,'PNG']]);flash('PNG 下載好了');}));
$('bGif').addEventListener('click',()=>busy($('bGif'),async()=>{
  const g=await buildGif();download(g,fname()+'_說話.gif');showResults([[g,'說話 GIF']]);flash('GIF 下載好了');}));
$('bPack').addEventListener('click',()=>busy($('bPack'),async()=>{
  const n=fname(),files=[],shown=[];
  for(const [label,pose] of POSES){const b=await pngOf(pose);files.push({name:`${n}_${label}.png`,data:await bytesOf(b)});shown.push([b,label]);}
  const g=await buildGif();files.push({name:`${n}_說話.gif`,data:await bytesOf(g)});shown.push([g,'說話 GIF']);
  const te=new TextEncoder();
  files.push({name:`${n}_角色代碼.txt`,data:te.encode(enc(state))});
  files.push({name:`使用說明.txt`,data:te.encode(README(n))});
  download(makeZip(files),n+'_主播包.zip');showResults(shown);flash('主播包下載好了，解壓縮後上傳到 Canva');}));

/* ================= 畫風切換 ================= */
const styleSel=$('styleSel');
function fillStyles(){styleSel.innerHTML='';STYLES.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;styleSel.append(o);});styleSel.value=state.style;}
async function setStyle(id,parts){
  stopTalk();
  const ok=await loadStyle(id);if(!ok){flash('這個畫風載入失敗，先用扁平圓潤風');id='flat';}
  state=sanitize(Object.assign({},parts||state,{style:id}));state.style=id;save();fillStyles();renderAll();
}
styleSel.addEventListener('change',()=>{history=[];setStyle(styleSel.value);});

window.__avatar={get state(){return state;},svg:svgDoc,inner,enc,dec,get PACK(){return PACK;},get FMT(){return FMT;},get BASE(){return BASE;},get VIEW(){return VIEW;},
  ORDER2,setStyle,buildGif,randomize,commit,bgSvg,BGS,makeZip,get tab(){return tab;},set tab(v){tab=v;renderTabs();renderOpts();}};
fillStyles();renderAll();
requestAnimationFrame(fitStage);
(async()=>{
  try{const r=await fetch('packs/index.json',{cache:'no-cache'});if(r.ok){(await r.json()).forEach(x=>{if(x&&x.id&&x.name&&!STYLES.some(y=>y.id===x.id))STYLES.push({id:String(x.id),name:String(x.name)});});}}catch(e){}
  fillStyles();
  if(saved&&saved.style&&saved.style!=='flat'&&STYLES.some(x=>x.id===saved.style))await setStyle(saved.style,saved);
})();
})();
