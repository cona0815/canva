<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<!-- 紙娃娃角色產生器 v0.2 2026-11-15 · Cona 老師的資訊教室
     v0.2：可切換畫風，從 packs/<id>/pack.json 載入風格包（格式見 packs/README.md）
     第 1 階段原型：扁平圓潤風、半身；換色、隨機、復原、說話預覽、PNG／主播包（zip：閉嘴＋張嘴＋眨眼＋說話 GIF）、角色代碼 -->
<title>紙娃娃角色產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：左邊是試衣間（預覽＋動作列），右邊是衣櫃（分類頁籤＋選項格＋色票），下方是出口（命名與匯出） */
:root{
  --bg:#f3f0fa; --paper:#ffffff; --ink:#2a2440; --muted:#6c6685; --line:#d9d3ea;
  --accent:#6b4fd8; --accent-soft:#e8e2fb; --sun:#ffc531; --ok:#2f9e5b; --warn:#e2553b;
  --f-d:"Huninn","Noto Sans TC",system-ui,sans-serif; --f-b:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17132a; --paper:#221c3a; --ink:#ece8fb; --muted:#a9a2c6; --line:#3a3260; --accent:#a58cff; --accent-soft:#30275a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17132a; --paper:#221c3a; --ink:#ece8fb; --muted:#a9a2c6; --line:#3a3260; --accent:#a58cff; --accent-soft:#30275a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:8px 16px;display:grid;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--f-d);font-weight:400;font-size:24px;margin:0}
header p{margin:0;color:var(--muted);font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:14px;align-items:start}
.right{display:grid;gap:12px;min-width:0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
/* 試衣間 */
.stage{aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);position:relative}
.stage svg{width:100%;height:100%;display:block}
.stage[data-bg="grid"]{background:repeating-conic-gradient(#e6e1f3 0 25%,#fff 0 50%) 0 0/28px 28px}
.stage[data-bg="none"]{background:var(--paper)}
.stage[data-bg="sky"]{background:linear-gradient(#bfe3ff,#eaf6ff)}
.stage[data-bg="news"]{background:linear-gradient(160deg,#1b4c9a,#0f2b5c 60%,#0a1d3f)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.outfit{margin-top:10px;font-size:13px;color:var(--muted)}
.outfit b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:0 10px;font-size:13px}
.tag:hover{border-color:var(--warn)}
/* 衣櫃 */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:4px 12px;font-weight:700;font-size:15px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:4px 4px 2px;display:grid;gap:0;justify-items:center;font-size:13px;font-weight:700}
.opt svg{width:100%;aspect-ratio:1;display:block;background:#fff;border-radius:10px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt:hover{border-color:var(--accent)}
.colors{display:grid;gap:6px;margin-top:10px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.crow .lab{font-weight:700;font-size:14px;min-width:3.5em}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 出口 */
.out{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
.out h2{font-family:var(--f-d);font-weight:400;font-size:18px;margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.txt{font:inherit;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
#results{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#results figure{margin:0;display:grid;justify-items:center;font-size:12px;color:var(--muted)}
#results img{width:64px;height:64px;border-radius:10px;border:2px solid var(--line);background:repeating-conic-gradient(#e6e1f3 0 25%,#fff 0 50%) 0 0/16px 16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:13px;text-align:center}
@media (max-width:860px){.main,.out{grid-template-columns:1fr}.stage{max-width:360px;margin-inline:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>紙娃娃角色產生器</h1>
    <p>點一點，組出你自己的虛擬主播。</p>
    <label for="styleSel" style="font-weight:700">畫風：<select id="styleSel" class="txt" style="padding:3px 10px"></select></label>
  </header>

  <div class="main">
    <section class="card" aria-label="預覽">
      <div class="stage" id="stage" data-bg="grid"></div>
      <div class="tools">
        <button class="btn pri" type="button" id="bRandom">隨機搭配</button>
        <button class="btn" type="button" id="bTalk" aria-pressed="false">說話預覽</button>
        <button class="btn" type="button" id="bFlip" aria-pressed="false">左右翻轉</button>
        <button class="btn" type="button" id="bBg">背景：格線</button>
        <button class="btn" type="button" id="bUndo">復原</button>
        <button class="btn" type="button" id="bReset">重設</button>
      </div>
      <div class="outfit">目前搭配 <b id="outfitN">0</b> 件（點一下可以脫掉）<div class="tags" id="outfit"></div></div>
    </section>

    <div class="right">
    <section class="card" aria-label="選擇部件">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="opts" id="opts"></div>
      <div class="colors" id="colors"></div>
    </section>

  <div class="out">
    <section class="card">
      <h2>幫角色取名字、存檔</h2>
      <div class="row">
        <label for="nameInput">名字</label>
        <input class="txt" id="nameInput" maxlength="10" style="width:10em" autocomplete="off">
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn" type="button" id="bCopyCode">複製角色代碼</button>
        <input class="txt" id="codeInput" placeholder="貼上角色代碼" style="flex:1" autocomplete="off" aria-label="貼上角色代碼">
        <button class="btn" type="button" id="bLoadCode">還原</button>
      </div>
      <p class="hint">角色會自動存在這台電腦。換電腦時，先複製角色代碼，到新電腦貼上再按「還原」。</p>
    </section>
    <section class="card">
      <h2>下載，帶去 Canva</h2>
      <div class="row">
        <button class="btn pri" type="button" id="bPng">下載 PNG</button>
        <button class="btn pri" type="button" id="bPack">下載主播包（zip）</button>
        <button class="btn" type="button" id="bGif">只下載說話 GIF</button>
      </div>
      <p class="hint">主播包裡有：閉嘴、張嘴、眨眼三張透明 PNG，加上一個會說話的 GIF。全部上傳到 Canva 就能做虛擬主播。</p>
      <div id="results" aria-live="polite"></div>
    </section>
  </div>
    </div>
  </div>
  <footer>Cona 老師的資訊教室 · 紙娃娃角色產生器 v0.2 · 2026-11-15</footer>
</div>
<div class="toast" id="toast" role="status"></div>

    p=k;}
  emit(p);emit(257);if(bits>0)out.push(cur&255);return out;}

  const top=[...count.entries()].sort((a,b)=>b[1]-a[1]).slice(0,255).map(e=>e[0]);

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function makeZip(files){ /* [{name,data:Uint8Array}] */
  const te=new TextEncoder(),chunks=[],central=[];let off=0;
  const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
  files.forEach(f=>{const n=te.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const head=[0x50,0x4B,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(n.length),...u16(0)];
    chunks.push(new Uint8Array(head),n,f.data);
    central.push(new Uint8Array([0x50,0x4B,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
    off+=head.length+n.length+sz;});
  const cs=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([0x50,0x4B,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...chunks,...central,end],{type:'application/zip'});}
const bytesOf=async b=>new Uint8Array(await b.arrayBuffer());

async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='製作中…';try{await fn();}catch(e){flash('製作失敗，請再試一次');}btn.disabled=false;btn.textContent=t;}
$('bPng').addEventListener('click',()=>busy($('bPng'),async()=>{
  const b=await canvasBlob(await toCanvas(svg(state,{mouth:'closed'},1000),1000));
  download(b,fname()+'.png');showResults([[b,'PNG']]);flash('PNG 下載好了');}));
$('bGif').addEventListener('click',()=>busy($('bGif'),async()=>{
  const g=await buildGif();download(g,fname()+'_說話.gif');showResults([[g,'說話 GIF']]);flash('GIF 下載好了');}));
$('bPack').addEventListener('click',()=>busy($('bPack'),async()=>{
  const files=[],shown=[];
  for(const [label,pose] of POSES){const b=await canvasBlob(await toCanvas(svg(state,pose,1000),1000));files.push({name:`${fname()}_${label}.png`,data:await bytesOf(b)});shown.push([b,label]);}
  const g=await buildGif();files.push({name:`${fname()}_說話.gif`,data:await bytesOf(g)});shown.push([g,'說話 GIF']);
  files.push({name:`${fname()}_角色代碼.txt`,data:new TextEncoder().encode(enc(state))});
  download(makeZip(files),fname()+'_主播包.zip');showResults(shown);flash('主播包下載好了，解壓縮後上傳到 Canva');}));

/* 畫風切換 */
const styleSel=$('styleSel');
function fillStyles(){styleSel.innerHTML='';STYLES.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;styleSel.append(o);});styleSel.value=state.style;}
async function setStyle(id,keepParts){
  const ok=await loadStyle(id);if(!ok){flash('這個畫風載入失敗，先用扁平圓潤風');id='flat';}
  const next=keepParts?sanitize(Object.assign({},keepParts,{style:id})):Object.assign({},state,PARTDEF,{style:id});
  state=sanitize(next);state.style=id;save();fillStyles();renderAll();
}
styleSel.addEventListener('change',()=>{history=[];setStyle(styleSel.value);});
window.__avatar={get state(){return state;},svg,enc,dec,get PACK(){return PACK;},get VIEW(){return VIEW;},get BASE(){return BASE;},get PARTDEF(){return PARTDEF;},ORDER,buildGif,setStyle};
fillStyles();renderAll();
(async()=>{
  try{const r=await fetch('packs/index.json',{cache:'no-cache'});if(r.ok){(await r.json()).forEach(x=>{if(x&&x.id&&x.name&&!STYLES.some(y=>y.id===x.id))STYLES.push({id:String(x.id),name:String(x.name)});});}}catch(e){}
  fillStyles();
  if(saved&&saved.style&&saved.style!=='flat'&&STYLES.some(x=>x.id===saved.style))await setStyle(saved.style,saved);
})();
})();
